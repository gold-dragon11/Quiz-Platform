# Render Blueprint for the L&S API.
#
# Apply from the Render dashboard: New → Blueprint → point it at this repo.
# Secrets are deliberately declared with `sync: false`, which makes Render
# prompt for them once and store them itself — they must never live in a file
# that is committed.
#
# The frontend is deployed separately on Vercel (see frontend/vercel.json).

databases:
  - name: quix-postgres
    databaseName: quiz_platform
    user: quiz_platform
    plan: free

services:
  - type: web
    name: quix-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    # Excluded from the API prefix in main.ts, and exempt from rate limiting,
    # so a frequent probe can never be rejected as abuse.
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      - key: DATABASE_URL
        fromDatabase:
          name: quix-postgres
          property: connectionString

      # Render terminates TLS one hop in front of the container, so the client
      # address arrives in X-Forwarded-For. Without this the rate limiter
      # counts every request against the proxy and throttles all users at once.
      - key: TRUST_PROXY
        value: 1

      # The deployed frontend's origin. Both must be the real domain once DNS
      # is pointed at Vercel — CORS_ORIGIN gates browser access to this API,
      # and FRONTEND_URL builds the links inside verification and reset email.
      - key: CORS_ORIGIN
        sync: false
      - key: FRONTEND_URL
        sync: false

      # Four independent signing secrets, minimum 32 characters each. Generate
      # with `openssl rand -base64 48` and never reuse one for another purpose.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_VERIFICATION_SECRET
        generateValue: true
      - key: PASSWORD_RESET_SECRET
        generateValue: true

      # Resend. EMAIL_FROM must be an address on a domain verified at
      # https://resend.com/domains — the app refuses to start if the key is
      # set without it.
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
