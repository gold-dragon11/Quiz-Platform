<!doctype html>
<html lang="uk" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS ignores the manifest's icons and takes this one for the home
         screen, so without it an installed app gets a screenshot instead. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0a0f" />
    <title>L&amp;S</title>

    <!--
      How the site looks when someone pastes the link into Telegram, Viber,
      LinkedIn or Slack. Those crawlers read the HTML as it is served — they do
      not run JavaScript — so the tags have to live here rather than be set by
      the app, and they describe the landing page whatever route the link
      points at.

      `og-image.png` is a 1200×630 crop of the landing page itself
      (docs/media/landing.png), served straight from `public/`. The SPA rewrite
      in vercel.json does not need an exception for it: Vercel checks the
      filesystem before applying rewrites, so a file that exists wins over the
      catch-all. The exceptions listed there earn their keep for a different
      case — a file that has stopped existing after a deploy, which the
      catch-all would otherwise answer with this page and a 200.
    -->
    <meta
      name="description"
      content="Підготовка до НМТ: практика за темами, пробні тести зі шкалою 100–200, повторення помилок, кабінет репетитора."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://learn-ls.com/" />
    <meta property="og:site_name" content="L&amp;S" />
    <meta property="og:title" content="L&amp;S — підготовка до НМТ" />
    <meta
      property="og:description"
      content="Практика за темами, пробні тести зі шкалою 100–200, повторення помилок і кабінет репетитора."
    />
    <meta property="og:image" content="https://learn-ls.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="uk_UA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="L&amp;S — підготовка до НМТ" />
    <meta
      name="twitter:description"
      content="Практика за темами, пробні тести зі шкалою 100–200, повторення помилок і кабінет репетитора."
    />
    <meta name="twitter:image" content="https://learn-ls.com/og-image.png" />

    <!--
      The theme, before the first pixel. ThemeProvider sets the same attribute,
      but it runs after React has mounted, and a reader who chose the light
      theme would watch the dark one flash first. This reads the very same
      persisted key and settles it in the document head instead.

      Deliberately unguarded by a try/catch around the whole body: if storage
      throws, the attribute already in the markup stands, which is the default.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('quix.theme');
          var preference = stored ? JSON.parse(stored).state.preference : 'dark';
          var light =
            preference === 'light' ||
            (preference === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
          // The landing page is pinned to dark (see usePinnedTheme). Honouring
          // the preference here and then having React pin it back would be the
          // very flash this script exists to prevent.
          if (light && location.pathname !== '/') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f7f6f9');
          }
        } catch (error) {
          /* No storage, or a key from an older version: the dark default stands. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
