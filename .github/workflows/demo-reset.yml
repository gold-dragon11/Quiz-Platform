# Rebuilds the public demo every night (docs/08-development/deployment.md §17.9).
#
# The demo's credentials are in the README, so by evening its accounts carry
# whatever strangers did to them during the day. The API rebuilds the demo in
# the background and answers 202 at once, so this run finishes in seconds even
# though the rebuild takes about a minute against the production database.
name: Demo reset

on:
  schedule:
    # 00:23 UTC — between two and three at night in Kyiv, whatever the season,
    # and off the top of the hour, where GitHub delays scheduled runs most.
    - cron: '23 0 * * *'
  workflow_dispatch:

# Nothing in the repository is read or written.
permissions: {}

jobs:
  reset:
    name: Reset
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork has neither the variable nor the secret, and nothing to call.
    if: ${{ vars.API_URL != '' }}

    steps:
      # A cold instance takes up to a minute to answer, hence the long timeout
      # and the retries. A retry is harmless: a reset already running is left
      # alone and reported as `started: false`.
      - name: Start the rebuild
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-delay 30 --retry-all-errors --max-time 90 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_URL%/}/api/v1/jobs/demo-reset"
