# Sends the morning digest to whoever runs the platform
# (docs/08-development/deployment.md §17.10).
#
# A quiet day sends nothing at all; Sunday additionally carries a week's
# summary, which goes out regardless so that silence stays distinguishable
# from a bot that stopped working.
name: Daily digest

on:
  schedule:
    # 06:11 UTC — nine in the morning in Kyiv over summer, eight over winter.
    # GitHub speaks only UTC, so the hour drifts with daylight saving and that
    # is accepted rather than worked around. Off the top of the hour, where
    # GitHub delays scheduled runs most.
    - cron: '11 6 * * *'
  workflow_dispatch:

# Nothing in the repository is read or written.
permissions: {}

jobs:
  digest:
    name: Digest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork has neither the variable nor the secret, and nothing to call.
    if: ${{ vars.API_URL != '' }}

    steps:
      # A cold instance takes up to a minute to answer, hence the long timeout
      # and the retries. A retry is not harmless here the way the demo reset's
      # is — it would send the digest twice — so only genuine connection
      # failures are retried, not a response the server actually gave.
      - name: Send the digest
        env:
          API_URL: ${{ vars.API_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-delay 30 --connect-timeout 90 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${API_URL%/}/api/v1/jobs/daily"
